[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magicstream"
version = "2.0.0"
description = "Professional 24/7 Multi-Platform Live Broadcast Engine with Adaptive Hardware Downgrading, Watermark Overlays, Studio TUI, and Multi-Destination RTMP."
readme = "README.md"
authors = [
    { name = "Shubham Kumar Jha" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "magicstream",
    "youtube-live",
    "facebook-live",
    "twitch",
    "kick",
    "live-streaming",
    "ffmpeg",
    "restreamer",
    "radio-stream",
    "24-7-stream",
    "rtmp",
    "broadcast"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
dependencies = [
    "yt-dlp>=2024.8.6",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "tqdm>=4.66.2",
    "apscheduler>=3.10.4",
    "gTTS>=2.5.0",
    "edge-tts>=7.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0"
]

[project.scripts]
magicstream = "magicstream.cli:main"
magicstream-studio = "magicstream.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["magicstream*", "core*"]
