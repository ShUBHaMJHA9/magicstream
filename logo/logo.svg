<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Red Live Glow -->
    <radialGradient id="liveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="1" />
      <stop offset="60%" stop-color="#ff0033" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box with Shadow & Rounded Corners -->
  <rect x="6" y="8" width="268" height="64" rx="16" ry="16"
        fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"
        filter="url(#dropShadow)" />

  <!-- Glowing Live Dot Outer -->
  <circle cx="38" cy="40" r="14" fill="url(#liveGlow)" opacity="0.6">
    <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Glowing Live Dot Inner -->
  <circle cx="38" cy="40" r="7" fill="#ff0033" />
  <circle cx="36" cy="38" r="2.5" fill="#ffffff" opacity="0.8" />

  <!-- "LIVE" Text -->
  <text x="62" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="900" letter-spacing="2" fill="#ffffff">
    LIVE
  </text>

  <!-- Divider Line -->
  <line x1="126" y1="24" x2="126" y2="56" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Stream Brand / Channel Text -->
  <text x="140" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="800" letter-spacing="1" fill="#38bdf8">
    YT STREAM
  </text>
  <text x="140" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#94a3b8">
    24/7 BROADCAST
  </text>
</svg>
